name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.12"

      - name: Install (locked)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # No secrets or API keys here. tests/conftest.py blocks outbound network, so a test that
      # tries to reach a real model API fails instead of silently calling it.
      - name: Tests
        run: uv run pytest -q

      # Regenerate every offline report from the committed runs and diff against results/.
      - name: Reproduce committed results
        run: uv run triage reproduce
