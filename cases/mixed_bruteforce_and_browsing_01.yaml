notes: >-
  From Kali I ran two things in the same window: an SSH password-guessing attack against labuser
  (failures only, correct password not in the list) and, concurrently, a handful of ordinary browser
  GETs to /. Ground truth is malicious because of the SSH brute force; the web browsing is benign noise
  that must not change the verdict. A mixed-window test for keeping the attack signal separate from
  benign traffic. Written before any AI, from the scenario as executed.
