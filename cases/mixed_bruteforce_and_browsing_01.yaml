source: own-lab
log_files:
  - data/raw/mixed_bruteforce_and_browsing_01/auth.log
  - data/raw/mixed_bruteforce_and_browsing_01/nginx_access.log
window: {start: "2026-10-21T18:36:01Z", end: "2026-10-21T18:36:46Z"}
expected:
  verdict: malicious
  attack_type: ssh_bruteforce
