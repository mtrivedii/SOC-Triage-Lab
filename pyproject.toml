[project]
name = "soc-triage-lab"
version = "0.1.0"
description = "AI-assisted SOC alert triage pipeline, measured against known cases"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pydantic",
    "python-dotenv",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
